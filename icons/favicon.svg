<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mydin">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset=".45" stop-color="#0f9488"/>
      <stop offset="1" stop-color="#0c5f58"/>
    </linearGradient>
    <linearGradient id="brilho" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#fundo)"/>
  <rect width="512" height="512" rx="116" fill="url(#brilho)"/>

  <!-- colunas: o histórico -->
  <g fill="#ffffff" opacity=".38">
    <rect x="112" y="300" width="52" height="100" rx="26"/>
    <rect x="196" y="264" width="52" height="136" rx="26"/>
    <rect x="280" y="288" width="52" height="112" rx="26"/>
    <rect x="364" y="228" width="52" height="172" rx="26"/>
  </g>

  <!-- linha: a tendência -->
  <path d="M138 266 L222 206 L306 238 L390 140"
        fill="none" stroke="#ffffff" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ponto de hoje -->
  <circle cx="390" cy="140" r="34" fill="#ffffff"/>
  <circle cx="390" cy="140" r="15" fill="#0f766e"/>
</svg>
